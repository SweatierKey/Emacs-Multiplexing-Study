name: Long-tail source census
on:
  push:
    paths: ['.github/workflows/long-tail.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Acquire long-tail projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/src out/research
          git clone --depth 1 https://github.com/melpa/melpa.git /tmp/melpa
          python3 - <<'PY'
          import pathlib,re,subprocess,json,concurrent.futures,urllib.request,urllib.parse,os,time
          out=pathlib.Path('out');candidates={}
          names='better-shell e2wm-term e2wm elscreen elscreen-multi-term elscreen-buffer-group eshell-up friendly-shell helm-switch-shell helm project-shells quick-shell-keybind shell-switcher shell-toggle sticky-shell term+key-intercept term-run termint toggle-term tramp-term vterm-editor workgroups workgroups2 eyebrowse perspective persp-mode simple-screen term-alert term-cmd xterm-color ht s dash posframe avy loop cl-lib emacs-async frame-local'.split()
          for name in names:
            p=pathlib.Path('/tmp/melpa/recipes')/name
            if not p.exists():continue
            text=p.read_text();repo=re.search(r':repo\s+"([^"]+)"',text);fetcher=re.search(r':fetcher\s+(\S+)',text);url=re.search(r':url\s+"([^"]+)"',text)
            if repo and fetcher:
              host={'github':'github.com','gitlab':'gitlab.com','codeberg':'codeberg.org','sourcehut':'git.sr.ht'}.get(fetcher[1].rstrip(')'))
              if host:candidates[name]='https://'+host+'/'+('~' if host=='git.sr.ht' else '')+repo[1]+('.git' if host!='git.sr.ht' else '')
            elif url:candidates[name]=url[1]
          candidates.update({name:'https://github.com/'+repo+'.git' for name,repo in [
            ('term-mux','merrickluo/term-mux.el'),('term-sessions','ArthurHeymans/emacs-term-sessions'),('navorski','roman/navorski.el'),('tmux-control-mode','stephenjayakar/emacs-tmux-control-mode'),('tmux-runner','joaofnds/emacs-tmux-runner'),('emacs-tunnel','mimunzar/emacs-tunnel'),('shell-toggle-plus','xcodebuild/shell-toggle-plus'),('eee','eval-exec/eee.el'),('eaf','emacs-eaf/emacs-application-framework'),('shell-command-x','elizagamedev/shell-command-x.el'),('rswitcher','DamienCassou/rswitcher'),('session','emacsorphanage/session'),('term-plus-xterm','tarao/term-plus-el'),('emux-attic','emacsattic/emux'),('xterm-256color','tarao/xterm-256color.el') ]})
          def clone(item):
            name,url=item;dest=out/'src'/name
            try:
              p=subprocess.run(['git','clone','--depth','1',url,str(dest)],capture_output=True,text=True,timeout=120)
              if p.returncode:return {'id':name,'url':url,'status':'fetch-failed','error':p.stderr[-1500:]}
              return {'id':name,'url':url,'status':'fetched','commit':subprocess.check_output(['git','-C',str(dest),'rev-parse','HEAD'],text=True).strip(),'commit_date':subprocess.check_output(['git','-C',str(dest),'show','-s','--format=%cI'],text=True).strip()}
            except Exception as e:return {'id':name,'url':url,'status':'fetch-failed','error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:rows=list(pool.map(clone,sorted(candidates.items())))
          (out/'research'/'acquisition-long-tail.json').write_text(json.dumps(rows,indent=2))
          for r in rows:print(r['id'],r['status'])
          for platform in ['codeberg','gitlab']:
            for page in range(1,6):
              url=('https://codeberg.org/api/v1/repos/search?'+urllib.parse.urlencode({'q':'emacs','limit':50,'page':page}) if platform=='codeberg' else 'https://gitlab.com/api/v4/projects?'+urllib.parse.urlencode({'search':'emacs','per_page':100,'page':page,'simple':'true'}))
              try:
                data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Emacs-Multiplexing-Study'}),timeout=25).read()
                (out/'research'/f'{platform}-broad-{page}.json').write_bytes(data)
                d=json.loads(data);items=d.get('data',[]) if isinstance(d,dict) else d
                if len(items)<(50 if platform=='codeberg' else 100):break
              except Exception as e:(out/'research'/f'{platform}-broad-{page}.error.txt').write_text(str(e));break
          PY
          find out/src -type d -name .git -prune -exec rm -rf {} +
          tar -C out -czf long-tail.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: study-long-tail
          path: long-tail.tar.gz
          retention-days: 14
