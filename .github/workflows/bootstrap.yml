name: Acquire study sources and lab
on:
  push:
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch recipes and independent source trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/src out/research
          git clone --depth 1 https://github.com/melpa/melpa.git /tmp/melpa
          cp -r /tmp/melpa/recipes out/research/melpa-recipes
          python3 - <<'PY'
          import pathlib,re,subprocess,json,concurrent.futures,datetime,urllib.request,urllib.parse,os
          out=pathlib.Path('out'); recipes=pathlib.Path('/tmp/melpa/recipes')
          names='eat vterm mistty coterm ghostel multi-term multi-vterm vterm-toggle shell-pop terminal-here shell-here eshell-toggle aweshell emamux eterm-256color eshell-vterm vterm-tmux detached dtache equake emux eee multi-eshell multi-buf multi-shell term-manager term+ terminal-toggle vterm-extra vterm-hotkey switch-shells eshell-switcher eshell-multiple vterm-projectile projectile-rails with-editor vertico marginalia compat dash s f consult hydra transient popper ace-window'.split()
          candidates={}
          for name in names:
            p=recipes/name
            if not p.exists(): continue
            text=p.read_text(); repo=re.search(r':repo\s+"([^"]+)"',text); fetcher=re.search(r':fetcher\s+(\S+)',text); url=re.search(r':url\s+"([^"]+)"',text)
            if repo and fetcher:
              host={'github':'github.com','gitlab':'gitlab.com','codeberg':'codeberg.org','sourcehut':'git.sr.ht'}.get(fetcher[1].rstrip(')'))
              if host: candidates[name]='https://'+host+'/'+repo[1]+'.git'
            elif url: candidates[name]=url[1]
          candidates.update({'ghostel':'https://github.com/dakra/ghostel.git','ghostel-mux':'https://github.com/SweatierKey/ghostel-mux.git','emux':'https://github.com/re5et/emux.git','eaf-terminal':'https://github.com/emacs-eaf/eaf-terminal.git','eat':'https://codeberg.org/akib/emacs-eat.git','mistty':'https://github.com/szermatt/mistty.git','coterm':'https://github.com/jdtsmith/coterm.git','aweshell':'https://github.com/manateelazycat/aweshell.git'})
          def clone(item):
            name,url=item; dest=out/'src'/name
            try:
              p=subprocess.run(['git','clone','--depth','1',url,str(dest)],capture_output=True,text=True,timeout=120)
              if p.returncode: return {'id':name,'url':url,'status':'fetch-failed','error':p.stderr[-1800:]}
              sha=subprocess.check_output(['git','-C',str(dest),'rev-parse','HEAD'],text=True).strip()
              date=subprocess.check_output(['git','-C',str(dest),'show','-s','--format=%cI'],text=True).strip()
              return {'id':name,'url':url,'commit':sha,'commit_date':date,'status':'fetched'}
            except Exception as e:return {'id':name,'url':url,'status':'fetch-failed','error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            rows=list(pool.map(clone,sorted(candidates.items())))
          (out/'research'/'acquisition.json').write_text(json.dumps(rows,indent=2))
          for row in rows: print(row['id'],row['status'],row.get('commit',''))
          queries=['emacs terminal emulator in:name,description','emacs terminal multiplexer in:name,description','emacs multiplex in:name,description','emacs vterm in:name,description','emacs terminal manager in:name,description','emacs eshell multiple in:name,description','emacs tmux in:name,description']
          for i,q in enumerate(queries):
            url='https://api.github.com/search/repositories?'+urllib.parse.urlencode({'q':q,'per_page':100})
            try:
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              data=urllib.request.urlopen(req,timeout=30).read(); (out/'research'/f'github-search-{i}.json').write_bytes(data)
            except Exception as e:(out/'research'/f'github-search-{i}.error.txt').write_text(str(e))
          (out/'research'/'queries.json').write_text(json.dumps(queries,indent=2))
          PY
          find out/src -type d -name .git -prune -exec rm -rf {} +
          tar -C out -czf sources.tar.gz src research
      - uses: actions/upload-artifact@v4
        with:
          name: study-sources
          path: sources.tar.gz
          retention-days: 14
      - name: Acquire Debian 13 packages for offline local execution
        run: |
          mkdir -p debs
          docker run --rm -v "$PWD/debs:/out" debian:trixie bash -c 'set -e; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install --download-only --no-install-recommends -y emacs-nox emacs-el elpa-vertico elpa-marginalia tmux screen libvterm-dev cmake libtool-bin openssh-server openssh-client less asciinema xterm; cp /var/cache/apt/archives/*.deb /out/'
          tar -czf lab-debs.tar.gz debs
      - uses: actions/upload-artifact@v4
        with:
          name: study-lab-debs
          path: lab-debs.tar.gz
          retention-days: 7
